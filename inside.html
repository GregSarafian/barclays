<!doctype html>
<!-- Barclays Center interiors: every display from the "Promo - Content Creation Guide" (Aug 2025) that the outside
     model doesn't cover, placed in three simplified spaces (Entrance & lobby, Concourse, Bowl).
     Screen sizes come from the guide's pixel dimensions; physical sizes are the guide's where it gives them
     (Atrium 65'9" x 6'6"), otherwise estimates. Drop a PNG/JPG/MP4 onto any screen to preview a design. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barclays Center Ad Scout · Inside</title>
<style>
  :root { --page: #fafafa; --ink: #0b0b0c; --muted: #6e6e73; --card: rgba(255,255,255,.78); --line: rgba(11,11,12,.08); --accent: #ffb800; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         color: var(--ink); background: #1b1d22; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .ui { position: fixed; z-index: 2; }
  .bar { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; background: var(--card);
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .bar button, .bar a { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600;
         font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; }
  .bar button:hover, .bar a:hover { background: rgba(11,11,12,.08); }
  .bar button.on { background: var(--ink); color: var(--page); }
  #views { right: 20px; bottom: 20px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }   /* layout switches */
  #panel { right: 16px; top: 16px; width: 330px; max-height: calc(100vh - 96px); display: flex; flex-direction: column;
           background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 20px;
           box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  #panel header { padding: 14px 16px 8px; }
  #panel h2 { margin: 0; font-size: 15px; font-weight: 800; }
  #panel header span { color: var(--muted); font-size: 12px; }
  #list { overflow: auto; padding: 0 8px 10px; }
  .group { margin: 10px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row { padding: 8px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
  .row:hover { background: rgba(11,11,12,.06); }
  .row.sel { border-color: var(--accent); background: rgba(255,184,0,.14); }
  .row .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row b { font-size: 13px; }
  .row .d { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .n { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .row .f { font-size: 11.5px; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .clear { margin-top: 6px; font: inherit; font-size: 12px; font-weight: 700; padding: 4px 12px; border: 0; border-radius: 999px;
                background: rgba(11,11,12,.07); color: var(--ink); cursor: pointer; }
  #toggle { right: 16px; top: 16px; z-index: 3; display: none; }
  @media (max-width: 720px) { #panel { width: calc(100vw - 32px); top: auto; bottom: 76px; max-height: 45vh; } }
</style>
<canvas id="scene" aria-label="3D model of Barclays Center interior spaces. Drag to rotate, scroll to zoom."></canvas>
<div id="views" class="ui"></div>
<aside id="panel" class="ui">
  <header><h2>Display</h2><span>The screens in this view. Click one to fly to it; press + or drop a PNG, JPG or MP4 onto a screen to add a design.</span></header>
  <div id="list"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
// ---------- setup ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060607);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2622, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(40, 80, 30); scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0.05 });
const M = { floor: mat(0x3b3d42), dark: mat(0x1f2126), wall: mat(0x55585e), seat: mat(0x2a2c33), bezel: mat(0x0c0c0e),
            concrete: mat(0x8a8c90), wood: mat(0xc9a06a), glass: new THREE.MeshStandardMaterial({ color: 0x9fb4c8, transparent: true, opacity: 0.18 }) };
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const box = (w, h, d, m, x, y, z, parent = scene) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); parent.add(o); return o; };
// dark spaces use unlit materials so the global fill light doesn't grey them out
const unlit = c => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).convertSRGBToLinear() });
const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
const flat = (tex, w, h, parent, x, y, z, ry = 0, extra = {}) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
  new THREE.MeshBasicMaterial({ map: tex, transparent: true, ...extra })); m.position.set(x, y, z); m.rotation.y = ry; m.raycast = () => {}; parent.add(m); return m; };
function glossyFloor(w, d, tint, parent, x, z, mirrorColor, opacity) {
  const mirror = new THREE.Reflector(new THREE.PlaneGeometry(w, d), { textureWidth: 1024, textureHeight: 1024, color: mirrorColor });
  mirror.rotation.x = -Math.PI / 2; mirror.position.set(x, 0, z); mirror.raycast = () => {}; parent.add(mirror);
  const speck = canvasTex(512, 512, (g, cw, ch) => { g.fillStyle = tint; g.fillRect(0, 0, cw, ch);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '230,220,210' : '30,26,24'},${Math.random() * .35})`; g.fillRect(Math.random() * cw, Math.random() * ch, 1.5, 1.5); } });
  speck.wrapS = speck.wrapT = THREE.RepeatWrapping; speck.repeat.set(w / 5, d / 5);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map: speck, roughness: 0.35, metalness: 0.1, transparent: true, opacity, color: 0x666666 }));
  f.rotation.x = -Math.PI / 2; f.position.set(x, 0.01, z); f.raycast = () => {}; parent.add(f);
}

// ---------- displays ----------
// One entry per creative file the guide asks for. A display can have several meshes (mirrored or repeated screens).
const COLORS = { Plaza: '#2f7de1', Concourse: '#7a4fd6', Bowl: '#e2563b' };
const displays = [];
function display(id, area, name, pw, ph, note) {
  const d = { id, area, name, pw, ph, note, meshes: [], file: null };
  d.material = new THREE.MeshBasicMaterial({ map: placeholder(d), toneMapped: false });
  displays.push(d); return d;
}
// Striped placeholder with the display's name and pixel size, like the outside model's "your ad here" panels.
function placeholder(d) {
  const W = Math.min(4096, Math.max(256, d.pw)), H = Math.max(24, Math.round(W * d.ph / d.pw));
  const c = document.createElement('canvas'); c.width = W; c.height = Math.min(H, 4096);
  const g = c.getContext('2d'), col = COLORS[d.area];
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = Math.max(4, c.height / 14);
  for (let x = -c.height; x < c.width; x += c.height / 2.5) { g.beginPath(); g.moveTo(x, c.height); g.lineTo(x + c.height, 0); g.stroke(); }
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const label = `${d.name.toUpperCase()} · ${d.pw}×${d.ph}`;
  if (c.width / c.height > 6) {   // ribbons: repeat the label along the strip
    g.font = `800 ${c.height * 0.55}px ui-rounded, -apple-system, sans-serif`;
    const step = g.measureText(label).width + c.height * 3;
    for (let x = step / 2; x < c.width + step; x += step) g.fillText(label, x, c.height / 2);
  } else {
    let fs = c.width / 12; g.font = `800 ${fs}px ui-rounded, -apple-system, sans-serif`;
    while (g.measureText(d.name.toUpperCase()).width > c.width * 0.86) g.font = `800 ${fs *= 0.9}px ui-rounded, -apple-system, sans-serif`;
    g.fillText(d.name.toUpperCase(), c.width / 2, c.height / 2 - fs * 0.45);
    g.font = `600 ${fs * 0.55}px ui-rounded, -apple-system, sans-serif`; g.globalAlpha = .85;
    g.fillText(`${d.pw} × ${d.ph} px`, c.width / 2, c.height / 2 + fs * 0.5);
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
// Static, non-ad parts of a screen (live game, transit board, menu, map).
function staticTex(text, bg, w = 1024, h = 576) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = `700 ${h / 9}px ui-rounded, -apple-system, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
// A flat screen of w×h metres facing +z of `parent`, showing display `d` over UV range [u0,u1]×[v0,v1].
function screen(d, w, h, parent, x, y, z, u0 = 0, u1 = 1, v0 = 0, v1 = 1) {
  const geo = new THREE.PlaneGeometry(w, h);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + (u1 - u0) * uv.getX(i), v0 + (v1 - v0) * uv.getY(i));
  const m = new THREE.Mesh(geo, d.material); m.position.set(x, y, z); m.userData.display = d;
  parent.add(m); d.meshes.push(m); return m;
}
function staticPlane(tex, w, h, parent, x, y, z) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  m.position.set(x, y, z); parent.add(m); return m;
}
// A 1920×1080 TV (16:9) with bezel; `parts` place displays/static art inside it by pixel rect [x, y, w, h] (y from top).
function tv(parent, x, y, z, ry, width, parts) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  const h = width * 9 / 16; box(width + 0.06, h + 0.06, 0.08, M.bezel, 0, 0, -0.045, g);
  for (const [what, px, py, pw, ph] of parts) {
    const w = width * pw / 1920, hh = h * ph / 1080, cx = -width / 2 + width * (px + pw / 2) / 1920, cy = h / 2 - h * (py + ph / 2) / 1080;
    if (what.material) screen(what, w, hh, g, cx, cy, 0.001); else staticPlane(what, w, hh, g, cx, cy, 0);
  }
  return g;
}

// ---------- the displays the guide lists ----------
const D = {
  atrium:   display('atrium', 'Plaza', 'Atrium', 1480, 120, 'Above the bowl entrance in the lobby. 65′9″ × 6′6″.'),
  wayFull:  display('wayfinding-full', 'Plaza', 'Wayfinding fullscreen', 1080, 1920, 'Touchscreen kiosks on the plaza (3).'),
  wayAlt:   display('wayfinding-alt', 'Plaza', 'Wayfinding alt ad', 1080, 600, 'Top of the kiosk while the map is showing.'),
  store:    display('store-panel', 'Plaza', 'Store panel', 174, 320, 'Small panel; placement estimated by the entrance.'),
  boH:      display('box-office-h', 'Concourse', 'Box office horizontal', 1600, 1080, 'Above the box office windows.'),
  boV:      display('box-office-v', 'Concourse', 'Box office vertical', 720, 1820, 'Tall screens flanking the windows.'),
  lwrap:    display('lwrap', 'Concourse', 'LWrap', 260, 934, 'Right-hand strip on BCTV screens; video area stays blank. Hard edge, no transparency.'),
  oneX5:    display('1x5', 'Concourse', '1x5 TV array', 5760, 1080, 'Middle three TVs of the five-TV arrays (export 1x5_01, 1x5_02). Keep logos and text off the bezels.'),
  menu:     display('menu', 'Concourse', 'Menu', 1920, 400, 'Bottom strip of concession menu boards; design area is the left 1066×400.'),
  transit:  display('transit', 'Concourse', 'Transit data', 432, 1080, 'Right strip of the subway board; design area 432×982.'),
  elevator: display('elevator', 'Concourse', 'Elevator TV', 1920, 1080, 'Visible content about 835 px tall; build past the mask.'),
  store2:   display('team-store-1x2', 'Concourse', 'Team store 1x2', 3840, 1080, 'Two-TV wall in the team store.'),
  store7:   display('team-store-1x7', 'Concourse', 'Team store 1x7', 13440, 1080, 'Seven-TV wall above the team store entrance.'),
  main:     display('main-video', 'Bowl', 'Main video', 1920, 1080, 'Four faces of the center-hung scoreboard.'),
  ring:     display('upper-ring', 'Bowl', 'Upper ring', 3872, 96, 'Ring on top of the scoreboard. Must loop seamlessly.'),
  ribbon:   display('360-ribbon', 'Bowl', '360 ribbon', 7128, 36, 'Circles the bowl above Suite Level A; mirrored on the opposite side. Scoring at px 2832–4080 and 5784–7032, clocks at 2736–2832 and 7032–7128.'),
  sideline: display('sideline-ribbon', 'Bowl', 'Sideline ribbon', 2760, 36, 'Above Suite Level B, north and south sides (mirrored).'),
  endFull:  display('endwall-full', 'Bowl', 'Full endwall', 580, 220, 'Upper pavilion, east and west (mirrored).'),
  endHalf:  display('endwall-half', 'Bowl', 'Half endwall', 288, 190, 'Right part of the endwall during sporting events; stats take the left. Toggle with the Full/Half buttons.'),
  nets:     display('scorers-nets', 'Bowl', 'Nets scorer’s table', 2160, 180, 'Courtside, basketball only. No white or light backgrounds.'),
  liberty:  display('scorers-liberty', 'Bowl', 'Liberty scorer’s table', 1800, 180, 'Same table for Liberty games. Toggle with the Nets/Liberty buttons.'),
};

// ---------- Bowl (origin) ----------
// Modelled on seat-view photos: black seats and fascias, light aisle stairs, a lit suite level between the two ribbon
// bands, a steep upper bowl, black truss roof with rows of spotlights, pale herringbone court with a black apron.
// 360 ribbon octagon from the guide's pixel map at a 16 mm pitch: N/S sides 2736 px, diagonals 1740 px, E/W 912 px.
const P = 0.016, RIB_Y = 12.25;
const bowl = new THREE.Group(); scene.add(bowl);
function oct(hx, hz, c) { const a = hx - c, e = hz - c; return [[-a, -hz], [a, -hz], [hx, -e], [hx, e], [a, hz], [-a, hz], [-hx, e], [-hx, -e]]; }
const tiled = (draw, w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
// one tile = 6 m of a seating row: black seat backs and a slightly lighter tread (aisles are separate strips)
const seatTex = tiled((g, w, h) => { g.fillStyle = '#0e0e10'; g.fillRect(0, 0, w, h); g.fillStyle = '#18191c'; g.fillRect(0, h * .62, w, h * .38);
  g.fillStyle = '#222328'; for (let x = 0; x < w; x += w / 12) g.fillRect(x + 2, h * .12, w / 12 - 4, h * .06); }, 512, 64);
const suiteTex = tiled((g, w, h) => { g.fillStyle = '#0d0d0f'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += w / 4) { const grd = g.createLinearGradient(0, h * .2, 0, h * .9); grd.addColorStop(0, '#f2b56b'); grd.addColorStop(1, '#7a4a22');
    g.fillStyle = grd; g.fillRect(x + 6, h * .22, w / 4 - 12, h * .6); g.fillStyle = 'rgba(255,240,210,.8)'; g.fillRect(x + w / 8 - 3, h * .26, 6, 4); } }, 512, 128);
// band between two octagons; u runs along the perimeter (metres / uScale), v up the slope (metres / vScale)
function band(inner, outer, y0, y1, m, uScale = 6, vScale = 0.9) {
  const pos = [], uv = []; let run = 0;
  for (let i = 0; i < 8; i++) {
    const [a, b] = [inner[i], inner[(i + 1) % 8]], [c, d] = [outer[i], outer[(i + 1) % 8]];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]), up = Math.hypot(Math.hypot(c[0] - a[0], c[1] - a[1]), y1 - y0);
    const u0 = run / uScale, u1 = (run + len) / uScale, v1 = up / vScale; run += len;
    pos.push(a[0], y0, a[1], c[0], y1, c[1], b[0], y0, b[1], b[0], y0, b[1], c[0], y1, c[1], d[0], y1, d[1]);
    uv.push(u0, 0, u0, v1, u1, 0, u1, 0, u0, v1, u1, v1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
  const m2 = m.clone(); m2.side = THREE.DoubleSide; const mesh = new THREE.Mesh(g, m2); bowl.add(mesh); return mesh;
}
// light-grey aisle stairs running straight up a seating band, about every 8 m along each side
const aisleMat = new THREE.MeshStandardMaterial({ color: 0x45464b, roughness: .8, side: THREE.DoubleSide });
function aisles(inner, outer, y0, y1, spacing = 8, w = 0.9) {
  const pos = [], lift = 0.04;
  for (let i = 0; i < 8; i++) {
    const [a, b] = [inner[i], inner[(i + 1) % 8]], [c, d] = [outer[i], outer[(i + 1) % 8]];
    const n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / spacing));
    for (let k = 0; k < n; k++) {
      const f = (k + 0.5) / n, lerp = (p, q) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
      const pi = lerp(a, b), po = lerp(c, d), dl = Math.hypot(b[0] - a[0], b[1] - a[1]), t = [(b[0] - a[0]) / dl * w / 2, (b[1] - a[1]) / dl * w / 2];
      const q = [[pi[0] - t[0], y0 + lift, pi[1] - t[1]], [pi[0] + t[0], y0 + lift, pi[1] + t[1]], [po[0] + t[0], y1 + lift, po[1] + t[1]], [po[0] - t[0], y1 + lift, po[1] - t[1]]];
      pos.push(...q[0], ...q[1], ...q[2], ...q[0], ...q[2], ...q[3]);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  bowl.add(new THREE.Mesh(g, aisleMat));
}
const seatMat = new THREE.MeshStandardMaterial({ map: seatTex, color: 0x8a8a8a, roughness: .9 }), black = mat(0x0b0b0d);
const I0 = oct(16.6, 9.9, 2.4), O1 = oct(41.6, 27.0, 19.7), O1b = oct(43.6, 29.0, 20.5), O2 = oct(46, 31.4, 21.5), O3 = oct(74, 60, 31);
band(I0, O1, 0.5, 11.6, seatMat); aisles(I0, O1, 0.5, 11.6, 7);  // lower bowl (100 level)
band(O1, O1, 11.6, 12.9, black);                                   // Suite A fascia: 360 ribbon
band(O1, O1b, 12.9, 12.9, black);
band(O1b, O1b, 12.9, 16.2, new THREE.MeshBasicMaterial({ map: suiteTex, toneMapped: false }), 4, 3.3);   // lit suites
band(O1b, O2, 16.2, 16.2, black);
band(O2, O2, 16.2, 17.7, black);                                   // Suite B fascia: sideline ribbons
band(O2, O3, 17.7, 37, seatMat); aisles(O2, O3, 17.7, 37, 10);   // upper bowl (200 level)
band(O3, O3, 37, 47, mat(0x101012));
box(160, 0.2, 130, black, 0, -0.1, 0, bowl);
// vomitories: dark tunnel openings set into the slope halfway up the lower bowl, with a rail along the top edge
const vomit = (x, z, ry, slope) => { const g = new THREE.Group(); g.position.set(x, 5.95, z); g.rotation.y = ry; g.rotateX(-slope); bowl.add(g);
  box(2.6, 0.06, 3.4, new THREE.MeshBasicMaterial({ color: 0x050505 }), 0, 0.05, 0, g); box(2.8, 0.5, 0.06, mat(0x3a3b40), 0, 0.3, -1.72, g); };
for (const x of [-15, -5, 5, 15]) { vomit(x, -18.45, 0, Math.atan2(11.1, 17.1)); vomit(x, 18.45, Math.PI, Math.atan2(11.1, 17.1)); }
for (const s of [-1, 1]) vomit(s * 29.1, 0, -s * Math.PI / 2, Math.atan2(11.1, 25));
// roof: black truss grid with rows of spotlights, a few hanging banners
box(160, 0.4, 130, mat(0x070708), 0, 48, 0, bowl);
const truss = mat(0x111215);
for (let x = -64; x <= 64; x += 12) box(0.5, 1.6, 120, truss, x, 46, 0, bowl);
for (let z = -56; z <= 56; z += 12) box(130, 0.5, 0.4, truss, 0, 45.4, z, bowl);
{ const dots = []; const ring = (hx, hz, y, step) => { for (let x = -hx; x <= hx; x += step) dots.push([x, y, -hz], [x, y, hz]); for (let z = -hz + step; z < hz; z += step) dots.push([-hx, y, z], [hx, y, z]); };
  ring(30, 20, 44.5, 0.9); ring(46, 34, 44.5, 1.1); ring(58, 46, 45, 1.4);
