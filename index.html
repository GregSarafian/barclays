<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Barclays Center Ad Scout</title>
<style>
:root { color-scheme: light; }
  :root {
    --page: #FAFAFA;
    --ink: #0B0B0C;
    --muted: #6E6E73;
    --sky: linear-gradient(180deg, #dfe9f3 0%, #f6efe4 100%);
    --glow: rgba(255,204,120,0.28);
    --card: rgba(255,255,255,0.72);
    --line: rgba(11,11,12,0.08);
    --accent: #FFB800;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--page);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background-color 1200ms ease, color 1200ms ease;
  }
  #sky {
    position: fixed; inset: 0; z-index: 0;
    background: var(--sky);
    transition: opacity 1200ms ease;
  }
  #sky::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(1200px 700px at 72% 12%, var(--glow), transparent 70%);
    pointer-events: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  /* ---- chrome ---- */
  .ui { position: fixed; z-index: 2; }
  #title { left: 24px; top: 22px; pointer-events: none; }
  #title .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: color-mix(in srgb, var(--ink) 10%, transparent);
    font-weight: 600; font-size: 14px; letter-spacing: 0.01em;
  }
  #title h1 { margin: 10px 0 4px; font-size: clamp(30px, 4vw, 48px); line-height: 0.95; letter-spacing: -0.02em; font-weight: 800; }
  #title p { margin: 0; color: var(--muted); font-weight: 500; font-size: 15px; }

  #controls { right: 20px; bottom: 20px; justify-content: flex-end; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: calc(100vw - 48px); }
  .seg, .btn, .views {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .seg button, .views button {
    appearance: none; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    transition: background-color .2s, transform .2s;
  }
  .seg button.on { background: var(--ink); color: var(--page); }
  .views button:hover, .seg button:hover:not(.on) { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .btn {
    appearance: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 13px; color: var(--ink);
    padding: 9px 16px; gap: 6px; user-select: none;
  }
  /* panel open: the toggle sits on the panel, so it drops its own button chrome */
  body:has(#panel:not(.collapsed)) #panel-toggle { background: transparent; border-color: transparent; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none; }
  /* icon buttons: same rounded line icons as the sidebar (sidebar.js) */
  .seg button.icon { padding: 7px 9px; display: inline-grid; place-items: center; }
  .btn.icon { padding: 7px; border-radius: 999px; }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .btn.primary { background: var(--accent); color: #1A1200; border-color: transparent; }
  .btn:active { transform: scale(0.97); }

  /* ---- ad panel ---- */
  #panel {
    right: 20px; top: 20px; width: 320px; max-height: calc(100vh - 100px);
    display: flex; flex-direction: column;
    background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,0.10);
    transition: transform .35s cubic-bezier(.22,1,.36,1), opacity .3s;
  }
  #panel.collapsed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  #panel-toggle { right: 20px; top: 20px; z-index: 3; }
  #panel header { padding: 16px 60px 10px 18px; display: flex; flex-direction: column; gap: 2px; }
  #panel header h2 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  #panel header span { color: var(--muted); font-size: 12px; font-weight: 500; }
  #ad-list { overflow: auto; padding: 0 10px 10px; }
  .ad-row {
    padding: 10px 10px 9px; border-radius: 14px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent; transition: background-color .15s, border-color .15s;
  }
  .ad-row:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .ad-row.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .ad-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ad-name { font-weight: 700; font-size: 13.5px; }
  .ad-dims { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ad-file { color: var(--muted); font-size: 12px; margin: 3px 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ad-row.loaded .ad-file { color: var(--ink); font-weight: 600; }
  .ad-actions { display: flex; gap: 6px; align-items: center; }
  .ad-actions .btn { padding: 6px 12px; font-size: 12px; box-shadow: none; }
  .rep { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .rep input { width: 44px; font: inherit; font-weight: 600; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  #panel footer { padding: 8px 18px 14px; color: var(--muted); font-size: 11.5px; line-height: 1.4; border-top: 1px solid var(--line); }

  #drop-hint {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    display: grid; place-items: center; font-weight: 800; font-size: clamp(20px, 3vw, 34px);
    color: var(--ink); background: color-mix(in srgb, var(--page) 55%, transparent);
    outline: 3px dashed var(--accent); outline-offset: -18px; border-radius: 28px;
    opacity: 0; transition: opacity .2s;
  }
  #drop-hint.show { opacity: 1; }
  #toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(10px); z-index: 6;
    background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 13px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    #panel { width: calc(100vw - 40px); top: auto; bottom: 78px; max-height: 50vh; }
    #title h1 { font-size: 28px; }
  }
</style>
<div id="sky"></div>
  <canvas id="scene" aria-label="3D model of the Barclays Center, Brooklyn. Drag to rotate, scroll to zoom."></canvas>

  <div id="controls" class="ui">
    <div class="seg" id="phase">
      <button data-phase="day" class="on icon" aria-label="Day" title="Day"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
      <button data-phase="night" class="icon" aria-label="Night" title="Night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg></button>
    </div>
    <div class="seg" id="creative-set" title="Ad option"></div>
    <div class="views" hidden><!-- driven by the sidebar (sidebar.js) -->
      <button data-view="front">Front</button>
      <button data-view="plaza">Plaza</button>
      <button data-view="overview">Overview</button>
      <button data-view="oculus">Oculus</button>
      <button data-view="atlantic">Atlantic Ave</button>
      <button data-view="flatbush">Flatbush Ave</button>
      <button data-view="aerial">Aerial</button>
    </div>
    <button class="btn icon" id="reset-view" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>
    <button class="btn primary icon" id="export" aria-label="Share this view" title="Share this view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5V3.5M8.5 7 12 3.5 15.5 7"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/></svg></button>
  </div>

  <button class="btn ui icon" id="panel-toggle" title="Show / hide display assets" aria-label="Show or hide display assets"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15M16.8 8.5h1.4M16.8 11.5h1.4"/></svg></button>
  <aside id="panel" class="ui">
    <header><h2>Display</h2><span>The screens in this view. Click one to select it; press + or drop a PNG, JPG or MP4 onto a screen to add a design.</span></header>
    <div id="ad-list"></div>
    <footer>“Tile” repeats a design across wide boards. Videos loop muted.</footer>
  </aside>

  <div id="drop-hint">Drop onto a screen</div>
  <div id="toast"></div>

  <script src="creatives.js"></script>
  <script src="app.js"></script>
  <script>
    // Share: send the current view as a PNG through the system share sheet. Where the browser can't share files,
    // the click falls through to app.js, which downloads the PNG instead.
    document.addEventListener('click', e => {
      if (!e.target.closest('#export') || !navigator.canShare?.({ files: [new File([''], 'x.png', { type: 'image/png' })] })) return;
      e.stopImmediatePropagation();
      window.__barclays.renderOnce();
      document.getElementById('scene').toBlob(blob => navigator.share({
        files: [new File([blob], 'Barclays Center Ad Scout.png', { type: 'image/png' })], title: 'Barclays Center Ad Scout',
      }).catch(() => {}), 'image/png');
    }, true);
  </script>
  <script>
    // Clicking a Display row flies the camera to face that screen; window.frameAds(ids) frames several screens at
    // once (the panel's Overview row), from the side their averaged facing points to.
    window.frameAds = ids => {
      const B = window.__barclays, ads = ids.map(id => B.ads.find(a => a.id === id)).filter(Boolean); if (!ads.length) return;
      if (ads.length === 1 && ads[0].id === 'oculus') return B.flyTo(...B.VIEWS.oculus);
      if (ads.length > 1 && ids.includes('oculus')) return B.flyTo(...B.VIEWS.front);   // oculus + glass: the front of the arena
      const V = B.camera.position.constructor, n = new V();
      ads[0].mesh.geometry.computeBoundingBox(); const box = ads[0].mesh.geometry.boundingBox.clone().makeEmpty();
      for (const { mesh: m } of ads) {
        m.updateWorldMatrix(true, false); const g = m.geometry; g.computeBoundingBox();
        const b = g.boundingBox.clone().applyMatrix4(m.matrixWorld), c = b.getCenter(new V()); box.union(b);
        // facing: the mesh's averaged normal, flipped to point away from the arena
        const k = new V(), nrm = g.attributes.normal;
        if (nrm) for (let i = 0; i < nrm.count; i++) k.x += nrm.getX(i), k.y += nrm.getY(i), k.z += nrm.getZ(i);
        k.transformDirection(m.matrixWorld); k.y = 0; if (k.lengthSq() < 1e-6) k.set(c.x + 10, 0, c.z); k.normalize();
        if (k.dot(new V(c.x + 10, 0, c.z - 5)) < 0) k.negate(); n.add(k);
      }
      const c = box.getCenter(new V()), size = box.getSize(new V());
      n.lengthSq() < 1e-6 ? n.set(c.x + 10, 0, c.z) : 0; n.normalize();
      if (ads.length === 1) {
        const span = Math.max(size.x, size.z, size.y * 2.2), dist = Math.max(16, span * 1.4);
        const pos = c.clone().addScaledVector(n, dist); pos.y = Math.max(1.7, c.y - size.y * 0.15);
        return B.flyTo(pos, c, 1200, 46);
      }
      // several screens: look square-on to the line through them (on the side they face), far enough that the
      // whole row fits between the two sidebars (~60% of the width)
      const cs = ads.map(({ mesh: m }) => m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld).getCenter(new V()));   // geometry is baked in world space for some screens
      const along = cs.reduce((m, p) => cs.reduce((m2, q) => p.distanceTo(q) > m2.distanceTo(new V()) ? q.clone().sub(p) : m2, m), new V(1, 0, 0)).setY(0).normalize();
      const perp = new V(-along.z, 0, along.x); if (perp.dot(n) < 0) perp.negate();
      const ext = cs.map(p => p.clone().sub(c).dot(along)), span = Math.max(...ext) - Math.min(...ext) + Math.max(size.y, 6);
      const cam = B.camera, hfov = 2 * Math.atan(Math.tan((46 * Math.PI / 180) / 2) * cam.aspect);   // flyTo lands at 46° fov
      const dist = Math.max(16, (span / 2) / Math.tan(hfov / 2) / 0.6);
      const pos = c.clone().addScaledVector(perp, dist); pos.y = c.y + Math.max(2, dist * 0.12);
      B.flyTo(pos, c, 1200, 46);
    };
    document.getElementById('panel').addEventListener('click', e => {
      const row = e.target.closest('[data-id]');
      if (!row || e.target.closest('button, input, label')) return;
      window.frameAds([row.dataset.id]);
    });
  </script>
  <script>window.goView = k => document.querySelector(`[data-view="${k}"]`)?.click();</script>
  <script src="roof-logo.js"></script>
  <script src="sidebar.js"></script>

</body></html>
